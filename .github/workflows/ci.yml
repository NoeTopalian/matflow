name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel previous in-flight runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-test:
    name: Typecheck + Lint + Vitest
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # A REAL Postgres. Previously DATABASE_URL was set to localhost:5432 with no
    # service behind it, so the ~74 DB-backed tests did not skip — they ERRORED
    # trying to connect, into a `continue-on-error` step that reported nothing.
    # CI looked green while a third of the suite never ran. The migrations
    # reference no custom roles, so a stock image is sufficient.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # Test-only secrets — keep CI green without exposing real values. The
      # security/integration tests use these via vitest mocks; nothing real
      # connects out from CI.
      NEXTAUTH_SECRET: ci-test-secret-not-real-32-chars-long
      AUTH_SECRET: ci-test-secret-not-real-32-chars-long
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres?schema=public
      NODE_ENV: test

    steps:
      # Audit iter-1-infra A7I1-S-1: pin to commit SHA, not floating @v4 tag.
      # A floating major tag can be force-pushed by a compromised upstream
      # maintainer + silently inject malicious code into CI (with full repo
      # access + DATABASE_URL_DIRECT/AWS secrets in scope). SHA-pinning makes
      # supply-chain compromise visible as a diff. Comment carries the
      # semantic version for grep-ability + Dependabot updates.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations to the CI database
        run: npx prisma migrate deploy

      - name: Typecheck
        run: npx tsc --noEmit

      # GATING. `npm run lint` runs eslint AND the UI-RULES ratchet, and fails if
      # either does (scripts/lint-all.mjs). It was continue-on-error while the
      # baseline was driven down; the baseline is now held by the ratchet itself,
      # so a non-gating lint step only hides regressions.
      - name: Lint (eslint + UI-RULES ratchet)
        run: npm run lint

      # The FULL suite gates: unit tests are DB-free and deterministic, and the
      # integration tests now have a real database to run against.
      - name: Vitest (full suite) — gating
        run: npm test
