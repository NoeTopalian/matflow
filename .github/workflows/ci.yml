name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel previous in-flight runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-test:
    name: Typecheck + Vitest
    runs-on: ubuntu-latest
    timeout-minutes: 12

    env:
      # Test-only secrets — keep CI green without exposing real values. The
      # security/integration tests use these via vitest mocks; nothing real
      # connects out from CI.
      NEXTAUTH_SECRET: ci-test-secret-not-real-32-chars-long
      AUTH_SECRET: ci-test-secret-not-real-32-chars-long
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres?schema=public
      NODE_ENV: test

    steps:
      # Audit iter-1-infra A7I1-S-1: pin to commit SHA, not floating @v4 tag.
      # A floating major tag can be force-pushed by a compromised upstream
      # maintainer + silently inject malicious code into CI (with full repo
      # access + DATABASE_URL_DIRECT/AWS secrets in scope). SHA-pinning makes
      # supply-chain compromise visible as a diff. Comment carries the
      # semantic version for grep-ability + Dependabot updates.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit

      # Lint is reported but does not gate yet — surfaced for visibility while the
      # codebase's lint baseline is driven to zero. Flip continue-on-error off to
      # make it blocking once clean.
      - name: Lint
        continue-on-error: true
        run: npm run lint

      # Unit tests are DB-free (Prisma is mocked) and deterministic, so they GATE
      # the PR — a red unit suite blocks the merge. (The earlier RB-001 "~143
      # failures" note is stale; the unit suite is green.)
      - name: Vitest (unit) — gating
        run: npm test -- tests/unit

      # The full suite incl. integration is informational here: the integration
      # tests need a real Postgres (no DB service is wired into this job yet), so
      # they are reported, not gated. Add a postgres service + seed to gate them.
      - name: Vitest (full, informational)
        continue-on-error: true
        run: npm test -- --run --reporter=default
