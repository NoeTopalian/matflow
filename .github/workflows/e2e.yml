name: E2E (Playwright)

# Deliberately NOT on pull_request. The suite takes ~10 minutes against a live
# dev server and a seeded database; gating every PR on it would trade a real
# blocker for a flaky one. It runs nightly and on demand, so regressions surface
# within a day rather than at deploy time.
#
# STATUS (11 Sep 2026): this workflow has never had a green run in CI. It was
# written from the local Playwright setup, which does pass (270 passed / 0
# failed, twice consecutively at --workers=2), and the gap between the two was
# environmental rather than a product regression: the job never set
# TESTING_MODE, so the suite's own ~168 logins tripped the login rate limiter
# and 52 of 53 failures read "Too many login attempts". That is fixed in the
# env block below. The residual failures after the fix are NOT yet triaged —
# do not read a red run here as a known-benign state, and do not read a green
# one as proof until a run actually goes green.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    # 75, not 30. The 30-minute cap was sized for the suite as it stood on
    # 15 Sep: ~270 tests in 12.9 minutes at --workers=2, plus ~6 minutes of
    # npm ci + prisma + seed + browser download. The campaign suites added the
    # week of 15–17 Sep took the tree to 46 spec files — card-scan.spec.ts
    # alone prints ten membership sheets per worker and drives a camera-less
    # scan flow — and the 16 and 17 Sep runs were CANCELLED at the cap
    # (both started 08:17, killed 08:48) rather than failing. A cancelled run
    # reports nothing: no pass/fail counts, no triage, no signal that the
    # product is or is not regressing. Two consecutive nights of that is worse
    # than a red board.
    #
    # 75 is roughly 3x the observed full-run cost, which leaves headroom for a
    # suite that grows again without silently re-creating the same blind spot,
    # and is still short enough that a genuine hang is killed within the hour
    # rather than burning runner minutes until GitHub's own 6-hour default.
    timeout-minutes: 75

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      NEXTAUTH_SECRET: ci-test-secret-not-real-32-chars-long
      AUTH_SECRET: ci-test-secret-not-real-32-chars-long
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres?schema=public
      # The e2e specs reset TOTP and rewrite fixtures on whatever DATABASE_URL
      # points at. That is safe ONLY because the service above is ephemeral and
      # local to this job. Never point this at a shared or production branch.
      CI: "true"
      # Playwright drives ~168 logins through the credentials provider. Without
      # this, the login rate limiter in auth.ts refuses them and the suite fails
      # on its own test harness rather than on the product: 52 of the 53 nightly
      # failures are "Too many login attempts".
      #
      # Safe here, and the safety is enforced in code rather than by convention.
      # isTestingMode() (lib/testing-mode.ts) refuses on VERCEL_ENV=production
      # AND on any DATABASE_URL pointing at the production Neon endpoint, so the
      # flag cannot be honoured anywhere it would matter. The postgres service
      # above is an ephemeral container local to this job.
      #
      # The bypass is additionally gated on the request looking local
      # (auth.ts: `isTestingMode() && isLocalhost`), which a direct request to
      # the job's own dev server satisfies.
      TESTING_MODE: "true"

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Seed fixtures
        run: npm run seed

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # `line` as well as `html`. With `html` alone the pass/fail counts live
      # only inside the uploaded artifact, so reading the state of the suite
      # meant downloading a zip — and when a run is cancelled at the timeout
      # the artifact upload is the step that never happens, leaving literally
      # no record of what passed. `line` puts the running progress and the
      # final summary in the job log itself, which survives a cancellation.
      - name: Run Playwright
        run: npx playwright test --workers=2 --reporter=line,html

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
